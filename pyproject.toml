[project]
name = "s4dpc"
version = "0.1.0"
description = "Why DPC fails on learned S4 surrogates: control-relevant derivative fidelity vs. prediction error"
requires-python = ">=3.10"
dependencies = [
    "jax==0.7.2",
    "flax==0.11.2",
    "optax==0.2.8",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "wandb",
    "s4-nnx @ git+https://github.com/binoygeorge97/s4-nnx.git@c706151e976c856b08fccfeaadc825e1e456e7c8",
]

# CLAUDE.md §7 says to pin s4-nnx to git tag v0.2.0, but that tag does not
# exist on the repo (only branches: main, copilot/create-repo-structure).
# Pinned to main's HEAD commit as of 2026-08-07 instead, which is at least
# as exact. Repoint this to v0.2.0 once that tag exists upstream.

[project.optional-dependencies]
# Kaggle/TACC install this extra; jax[cuda12] wheels are Linux-only, so plain
# `pip install -e .` still works for local editing on a CPU-only machine.
cuda = ["jax[cuda12]==0.7.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["s4dpc*"]
